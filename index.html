<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Sankar Matriculation School – Attendance</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#f6f4ee;--card:#fffefa;--tx:#14213d;--mu:#6b7280;--pr:#14213d;--ac:#b8892b;--bd:#e5dfd0;--ok:#1d7a4d;--no:#b8372b;--lv:#b7791f;--sh:0 6px 24px rgba(20,33,61,.08);--hero:linear-gradient(145deg,#14213d,#1f3a6b);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1119;--card:#161c28;--tx:#ece8dc;--mu:#98a0b0;--pr:#d8b25a;--ac:#d8b25a;--bd:#262e3e;--sh:0 6px 24px rgba(0,0,0,.4);--hero:linear-gradient(145deg,#0a0e16,#1a2440);color-scheme:dark}}
:root[data-theme=dark]{--bg:#0d1119;--card:#161c28;--tx:#ece8dc;--mu:#98a0b0;--pr:#d8b25a;--ac:#d8b25a;--bd:#262e3e;--sh:0 6px 24px rgba(0,0,0,.4);--hero:linear-gradient(145deg,#0a0e16,#1a2440);color-scheme:dark}
html{height:100%}*{box-sizing:border-box}body{margin:0;font:15px Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);transition:background .3s,color .3s}
h1,h2,h3,.serif{font-family:'Playfair Display',Georgia,serif;margin:0}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes gw{from{width:0}}
.fx>*{animation:up .5s both}.fx>*:nth-child(2){animation-delay:.07s}.fx>*:nth-child(3){animation-delay:.14s}.fx>*:nth-child(4){animation-delay:.21s}.fx>*:nth-child(5){animation-delay:.28s}
button,input,select{font:inherit;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);transition:.2s}
input:focus,select:focus{outline:2px solid var(--ac);border-color:transparent}
button{cursor:pointer;background:var(--pr);color:var(--bg);border-color:var(--pr);font-weight:500}button:hover{transform:translateY(-1px);box-shadow:var(--sh)}
:root[data-theme=dark] button:not(.s):not(.sgb),:root:not([data-theme=light]) button:not(.s):not(.sgb){color:#14213d}
button.s{background:transparent;color:var(--tx);border-color:var(--bd)}
header{display:flex;gap:10px;align-items:center;padding:12px 18px;background:var(--hero);color:#f3ead2;flex-wrap:wrap;border-bottom:3px solid var(--ac)}
header .crest{width:40px;height:40px;border-radius:50%;border:2px solid var(--ac);display:grid;place-items:center;font-family:'Playfair Display',serif;color:var(--ac);font-weight:700}
header h1{font-size:18px;flex:1;min-width:180px}header small{display:block;font:11px Inter;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
header button{background:transparent;color:#f3ead2!important;border-color:rgba(243,234,210,.4);padding:7px 11px}
nav{display:flex;gap:4px;padding:12px 18px 4px;flex-wrap:wrap;max-width:1060px;margin:auto}
nav button{background:transparent;color:var(--mu)!important;border:0;border-bottom:2px solid transparent;border-radius:0}nav button.on{color:var(--tx)!important;border-color:var(--ac)}
main{padding:6px 18px 40px;max-width:1060px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:12px 0;box-shadow:var(--sh)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.row>*{flex:1 1 140px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:var(--sh);border-top:3px solid var(--ac)}.stat b{font:700 30px 'Playfair Display',serif;display:block}.stat span{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}tr:hover td{background:rgba(184,137,43,.06)}
.bars{display:flex;gap:10px;align-items:flex-end;height:130px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.bars i{display:block;background:linear-gradient(var(--ac),var(--pr));border-radius:6px 6px 0 0;transform-origin:bottom;animation:grow .8s both}
.pg{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:4px 0 10px}.pg i{display:block;height:100%;background:var(--ok);border-radius:6px;animation:gw 1s both}
.sg{display:flex;gap:4px}.sgb{background:transparent;color:var(--tx);border-color:var(--bd);padding:6px 11px}.sgb.P.on{background:var(--ok);color:#fff;border-color:var(--ok)}.sgb.A.on{background:var(--no);color:#fff;border-color:var(--no)}.sgb.L.on{background:var(--lv);color:#fff;border-color:var(--lv)}
.mu{color:var(--mu);font-size:13px}.err{color:var(--no);min-height:18px}.tag{padding:2px 9px;border-radius:20px;font-size:12px;background:rgba(184,137,43,.15);color:var(--ac)}
#auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}.hero{background:var(--hero);color:#f3ead2;padding:50px;display:flex;flex-direction:column;justify-content:center;gap:14px}.hero h1{font-size:38px;line-height:1.15}.hero .crest{width:64px;height:64px;font-size:26px;border-radius:50%;border:2px solid var(--ac);display:grid;place-items:center;color:var(--ac);font-family:'Playfair Display',serif}.hero p{opacity:.75;max-width:380px}
.form{display:flex;flex-direction:column;justify-content:center;padding:40px;max-width:420px;width:100%;margin:auto;gap:10px;animation:up .6s both}.form input,.form select{width:100%}
@media(max-width:760px){#auth{grid-template-columns:1fr}.hero{padding:28px}.hero h1{font-size:26px}}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:30px;box-shadow:var(--sh);animation:up .3s both;z-index:9}
@media print{header,nav,.row,#toast{display:none}}

.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.mn{min-width:0}.mn main{max-width:1200px;padding-top:4px}
aside{background:var(--hero);color:#f3ead2;position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 12px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--bd);z-index:20}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}.brand .crest{width:38px;height:38px;flex:none;border-radius:50%;border:2px solid var(--ac);display:grid;place-items:center;font:700 17px 'Playfair Display',serif;color:var(--ac)}.brand b{font:600 15px/1.2 'Playfair Display',serif}.brand small{display:block;font:10px Inter;letter-spacing:.14em;text-transform:uppercase;opacity:.6;margin-top:2px}
.gl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.5;padding:14px 12px 6px}
.nv{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-radius:10px;color:#d9d2bd!important;padding:10px 12px;font-weight:500}.nv:hover{transform:none;box-shadow:none;background:rgba(255,255,255,.07)}.nv.on{background:rgba(216,178,90,.16);color:#fff!important;box-shadow:inset 3px 0 0 var(--ac)}.nv .bd{margin-left:auto;background:var(--ac);color:#14213d;border-radius:20px;font-size:11px;padding:1px 8px;font-weight:600}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sf{margin-top:auto;padding-top:14px;border-top:1px solid rgba(243,234,210,.15)}.sf .who{padding:8px 12px;font-size:13px}.sf .who small{display:block;opacity:.6;text-transform:capitalize}
.top{display:flex;align-items:center;gap:12px;padding:16px 18px 6px;max-width:1200px;margin:auto}.top h2{flex:1;font-size:24px}.ic{background:transparent;color:var(--tx)!important;border-color:var(--bd);padding:8px;display:grid;place-items:center}.mb{display:none}.ov{display:none}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.g2 .card{margin:0}.g2+.g2,.grid+.g2{margin-top:12px}
.ln{fill:none;stroke:var(--ac);stroke-width:2.5;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.6s .2s forwards}@keyframes dr{to{stroke-dashoffset:0}}.dn{animation:gw .01s}
.lg{display:flex;gap:14px;font-size:12px;color:var(--mu);justify-content:center;flex-wrap:wrap}.lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
@media(max-width:860px){.shell{grid-template-columns:1fr}aside{position:fixed;left:0;top:0;width:270px;transform:translateX(-100%);transition:transform .3s}aside.open{transform:none;box-shadow:var(--sh)}.mb{display:grid}.ov.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15}}
</style></head><body><div id="app"></div>
<script>
const KEY='sms_att_v1',TK='sms_theme';let mem=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sha=async(u,p)=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('sms|'+u+'|'+p)))].map(b=>b.toString(16).padStart(2,'0')).join('');
let db,me=null,tab='dash',msg='',mode='login';
const $=id=>document.getElementById(id),v=id=>($(id)?.value||'').trim(),today=()=>new Date().toISOString().slice(0,10);
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){mem=db}}
function toast(t){const e=document.createElement('div');e.id='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
function theme(t){const d=document.documentElement;if(!t){try{t=localStorage.getItem(TK)}catch(e){}}if(t){d.dataset.theme=t;try{localStorage.setItem(TK,t)}catch(e){}}}
function flip(){const dk=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;theme(dk?'light':'dark')}
async function load(){try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){db=mem}
 if(!db)db={users:[{u:'admin',h:await sha('admin','admin123'),name:'Administrator',role:'admin',cls:[]}],classes:['6-A'],students:[],att:{}}}
const classesOf=()=>me.role==='admin'?db.classes:db.classes.filter(c=>me.cls.includes(c));
function auth(){const reg=mode==='reg';$('app').innerHTML=`<div id="auth"><div class="hero"><div class="crest">S</div><h1>Sankar Matriculation<br>School</h1><p>Sankagiri West, Namakkal District, Tamil Nadu</p><p class="serif" style="font-style:italic;color:var(--ac)">Discipline. Knowledge. Character.</p><div><button class="s" style="color:#f3ead2;border-color:rgba(243,234,210,.4);display:inline-flex;gap:8px;align-items:center" onclick="flip()">${ico('theme')}Theme</button></div></div>
<div class="form"><h2>${reg?'Teacher Registration':'Welcome back'}</h2><div class="mu">${reg?'Your account will be activated after administrator approval.':'Sign in to the attendance portal.'}</div>
${reg?'<input id="rn" placeholder="Full name" maxlength="50">':''}<input id="lu" placeholder="Username" autocomplete="username"><input id="lp" type="password" placeholder="Password${reg?' (min 8)':''}" autocomplete="current-password" onkeydown="if(event.key==='Enter')${reg?'doReg()':'doLogin()'}">
<button onclick="${reg?'doReg()':'doLogin()'}">${reg?'Request account':'Sign in'}</button><div class="err">${esc(msg)}</div>
<a href="#" class="mu" onclick="mode='${reg?'login':'reg'}';msg='';auth();return false">${reg?'Back to sign in':'New teacher? Register here'}</a>${reg?'':'<div class="mu">First use: admin / admin123 — change it in Users.</div>'}</div></div>`}
async function doLogin(){const u=v('lu'),h=await sha(u,$('lp').value),f=db.users.find(x=>x.u===u&&x.h===h);
 if(!f)msg='Invalid username or password.';else if(f.status==='pending')msg='Awaiting administrator approval.';else if(f.status==='suspended')msg='Your access has been suspended. Contact the administrator.';else{me=f;f.last=Date.now();save();msg='';tab='dash';return render()}auth()}
async function doReg(){const u=v('lu'),p=$('lp').value,n=v('rn');
 if(!/^[a-z0-9_.]{3,20}$/i.test(u)||p.length<8||n.length<2)msg='Valid name, username (3–20 chars) and password (8+) required.';
 else if(db.users.some(x=>x.u===u))msg='Username already taken.';else{db.users.push({u,h:await sha(u,p),name:n,role:'teacher',cls:[],status:'pending'});save();mode='login';msg='Request sent. Wait for approval.';return auth()}auth()}
const IC={"dash": "<rect x=\"3\" y=\"3\" width=\"7\" height=\"9\" rx=\"1\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"5\" rx=\"1\"/><rect x=\"14\" y=\"12\" width=\"7\" height=\"9\" rx=\"1\"/><rect x=\"3\" y=\"16\" width=\"7\" height=\"5\" rx=\"1\"/>", "att": "<path d=\"M9 11l3 3L22 4\"/><path d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"/>", "rep": "<path d=\"M18 20V10M12 20V4M6 20v-6\"/>", "stu": "<path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8\"/>", "cls": "<path d=\"M4 19.5A2.5 2.5 0 0 1 6.5 17H20\"/><path d=\"M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z\"/>", "usr": "<path d=\"M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/>", "bak": "<path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"/><path d=\"M7 10l5 5 5-5M12 15V3\"/>", "theme": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 3v18\"/><path d=\"M12 3a9 9 0 0 1 0 18z\" fill=\"currentColor\"/>", "out": "<path d=\"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9\"/>", "menu": "<path d=\"M3 12h18M3 6h18M3 18h18\"/>"};const ico=k=>`<svg class="i" viewBox="0 0 24 24">${IC[k]}</svg>`;let sb=0;
function go(t){tab=t;sb=0;render()}
function render(){if(!me)return auth();const A=me.role==='admin',pend=db.users.filter(u=>u.status==='pending').length;
const G=[['Overview',[['dash','Dashboard']]],['Attendance',[...(A?[]:[['att','Mark Attendance']]),['rep','Reports']]],...(A?[['Management',[['stu','Students'],['cls','Classes'],['usr','Teachers']]],['System',[['bak','Backup & Restore']]]]:[])],
T={dash:'Dashboard',att:'Mark Attendance',rep:'Attendance Reports',stu:'Students',cls:'Classes',usr:'Teachers',bak:'Backup & Restore'};
$('app').innerHTML=`<div class="shell"><aside class="${sb?'open':''}"><div class="brand"><div class="crest">S</div><div><b>Sankar Matriculation</b><small>Attendance Portal</small></div></div>
${G.map(g=>`<div class="gl">${g[0]}</div>${g[1].map(x=>`<button class="nv ${tab===x[0]?'on':''}" onclick="go('${x[0]}')">${ico(x[0])}${x[1]}${x[0]==='usr'&&pend?`<span class="bd">${pend}</span>`:''}</button>`).join('')}`).join('')}
<div class="sf"><div class="who">${esc(me.name)}<small>${me.role}</small></div><button class="nv" onclick="flip()">${ico('theme')}Switch theme</button><button class="nv" onclick="me=null;auth()">${ico('out')}Sign out</button></div></aside>
<div class="ov ${sb?'on':''}" onclick="sb=0;render()"></div><div class="mn"><div class="top"><button class="ic mb" onclick="sb=1;render()">${ico('menu')}</button><h2>${T[tab]}</h2><button class="ic" onclick="flip()">${ico('theme')}</button></div><main class="fx">${{dash:vDash,att:vAtt,rep:vRep,stu:vStu,cls:vCls,usr:vUsr,bak:vBak}[tab]()}</main></div></div>`;
 document.querySelectorAll('[data-n]').forEach(e=>{const n=+e.dataset.n,s=e.dataset.s||'',t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/900);e.textContent=Math.round(n*p)+s;if(p<1)requestAnimationFrame(f)})(t0)})}
function vDash(){const cs=classesOf(),st=db.students.filter(s=>cs.includes(s.cls)),td=today(),m=td.slice(0,7);
const T=(f,l=cs)=>{let P=0,A=0,L=0;for(const k in db.att){const[d,c]=k.split('|');if(!l.includes(c)||!f(d))continue;for(const x of Object.values(db.att[k])){if(x==='P')P++;else if(x==='A')A++;else L++}}return{P,A,L,n:P+A+L}};
const pc=t=>t.n?t.P/t.n*100:0,t0=T(d=>d===td),tm=T(d=>d.startsWith(m));
const days=[...Array(14)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-13+i);const k=d.toISOString().slice(0,10);return[k.slice(5),Math.round(pc(T(x=>x===k)))]});
const pts=days.map((d,i)=>[24+i*(552/13),160-d[1]*1.4]),ln=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
const chart=`<svg viewBox="0 0 600 190" style="width:100%"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--ac)" stop-opacity=".3"/><stop offset="1" stop-color="var(--ac)" stop-opacity="0"/></linearGradient></defs>${[0,50,100].map(v=>`<line x1="20" x2="580" y1="${160-v*1.4}" y2="${160-v*1.4}" stroke="var(--bd)"/><text x="0" y="${164-v*1.4}" font-size="10" fill="var(--mu)">${v}</text>`).join('')}<path d="${ln} L${pts[13][0]} 160 L${pts[0][0]} 160Z" fill="url(#g)"/><path class="ln" pathLength="1" d="${ln}"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--card)" stroke="var(--ac)" stroke-width="2"/>${i%2?'':`<text x="${p[0]}" y="182" font-size="10" text-anchor="middle" fill="var(--mu)">${days[i][0]}</text>`}`).join('')}</svg>`;
const C=2*Math.PI*52;let off=0;const seg=[[t0.P,'var(--ok)'],[t0.A,'var(--no)'],[t0.L,'var(--lv)']].map(x=>{const l=t0.n?x[0]/t0.n*C:0,r=`<circle cx="70" cy="70" r="52" fill="none" stroke="${x[1]}" stroke-width="14" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=l;return r}).join('');
const donut=`<svg viewBox="0 0 140 140" style="width:170px;display:block;margin:auto"><circle cx="70" cy="70" r="52" fill="none" stroke="var(--bd)" stroke-width="14"/>${seg}<text x="70" y="76" text-anchor="middle" font-size="22" font-family="Playfair Display,serif" fill="var(--tx)">${t0.n?Math.round(pc(t0))+'%':'-'}</text></svg>`;
const low=st.map(s=>{let P=0,n=0;for(const k in db.att){if(!k.startsWith(m)||k.split('|')[1]!==s.cls)continue;const x=db.att[k][s.id];if(x){n++;if(x==='P')P++}}return{s,pc:n?P/n*100:null}}).filter(x=>x.pc!==null).sort((a,b)=>a.pc-b.pc).slice(0,6);
const un=cs.filter(c=>!db.att[td+'|'+c]&&db.students.some(s=>s.cls===c)),pend=db.users.filter(u=>u.status==='pending').length;
const bar=(l,p,c)=>`<div class="mu" style="display:flex;justify-content:space-between"><span>${l}</span><span>${Math.round(p)}%</span></div><div class="pg"><i style="width:${p}%;background:${c}"></i></div>`;
const col=p=>p<75?'var(--no)':p<90?'var(--lv)':'var(--ok)';
return `<div><div class="mu">${new Date().toDateString()}</div><h2 style="margin:2px 0 4px">Good ${new Date().getHours()<12?'morning':'day'}, ${esc(me.name.split(' ')[0])}</h2></div>
<div class="grid"><div class="stat"><span>Students</span><b data-n="${st.length}"></b></div><div class="stat"><span>Classes</span><b data-n="${cs.length}"></b></div><div class="stat"><span>Present today</span><b data-n="${t0.P}"></b></div><div class="stat"><span>Absent today</span><b data-n="${t0.A}"></b></div><div class="stat"><span>On leave today</span><b data-n="${t0.L}"></b></div><div class="stat"><span>Month average</span><b data-n="${Math.round(pc(tm))}" data-s="%"></b></div></div>
<div class="g2"><div class="card"><h3>Attendance trend, last 14 days</h3>${chart}</div><div class="card"><h3>Today</h3>${donut}<div class="lg"><span><i style="background:var(--ok)"></i>Present ${t0.P}</span><span><i style="background:var(--no)"></i>Absent ${t0.A}</span><span><i style="background:var(--lv)"></i>Leave ${t0.L}</span></div></div></div>
<div class="g2"><div class="card"><h3>Class-wise average, this month</h3>${cs.map(c=>{const p=pc(T(d=>d.startsWith(m),[c]));return bar(esc(c),p,col(p))}).join('')||'<span class="mu">No classes.</span>'}</div>
<div class="card"><h3>Lowest attendance, this month</h3>${low.map(x=>bar(esc(x.s.name)+' <span class="tag">'+esc(x.s.cls)+'</span>',x.pc,col(x.pc))).join('')||'<span class="mu">No data yet.</span>'}</div></div>
<div class="g2"><div class="card"><h3>Needs attention</h3><div class="mu" style="line-height:1.9">${un.length?'Not marked today: '+un.map(c=>`<span class="tag">${esc(c)}</span>`).join(' '):'All classes marked today.'}${me.role==='admin'&&pend?`<br>${pend} teacher request(s) awaiting approval.`:''}</div></div>
<div class="card"><h3>Quick actions</h3><div class="row">${me.role==='admin'?'':`<button onclick="go('att')">Mark attendance</button>`}<button class="${me.role==='admin'?'':'s'}" onclick="go('rep')">View reports</button>${me.role==='admin'?`<button class="s" onclick="go('stu')">Add student</button>`:''}</div></div></div>`}
function vAtt(){if(me.role==='admin')return'<div class="card">Attendance is marked by teachers. Administrators have view-only access through the Reports page.</div>';
const c=window._ac||classesOf()[0],d=window._ad||today();window._ac=c;window._ad=d;
 if(!c)return'<div class="card">No class assigned. Ask the administrator.</div>';
 const st=db.students.filter(s=>s.cls===c),rec=db.att[d+'|'+c]||{};
 return `<div class="card"><div class="row"><select onchange="window._ac=this.value;render()">${classesOf().map(x=>`<option ${x===c?'selected':''}>${esc(x)}</option>`).join('')}</select><input type="date" value="${d}" max="${today()}" onchange="window._ad=this.value;render()"></div>
<div class="row"><button class="s" onclick="markAll('P')">All present</button><button class="s" onclick="markAll('A')">All absent</button></div>
<div class="tw"><table>${st.map(s=>`<tr><td>${esc(s.adm)}</td><td>${esc(s.name)}</td><td><div class="sg">${['P','A','L'].map(k=>`<button class="sgb ${k} ${rec[s.id]===k?'on':''}" onclick="mark('${s.id}','${k}')">${{P:'Present',A:'Absent',L:'Leave'}[k]}</button>`).join('')}</div></td></tr>`).join('')||'<tr><td>No students in this class.</td></tr>'}</table></div>
<p class="mu">Marked ${Object.keys(rec).length} of ${st.length} · saved automatically${(m=>m?` · last updated by ${esc(db.users.find(u=>u.u===m.by)?.name||m.by)}, ${new Date(m.at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`:'')((db.meta||{})[d+'|'+c])}</p></div>`}
function mark(id,k){if(me.role!=='teacher')return;db.meta=db.meta||{};db.meta[window._ad+'|'+window._ac]={by:me.u,at:Date.now()};const key=window._ad+'|'+window._ac;(db.att[key]=db.att[key]||{})[id]=k;save();render()}
function markAll(k){if(me.role!=='teacher')return;db.meta=db.meta||{};db.meta[window._ad+'|'+window._ac]={by:me.u,at:Date.now()};const key=window._ad+'|'+window._ac;db.att[key]=db.att[key]||{};db.students.filter(s=>s.cls===window._ac).forEach(s=>db.att[key][s.id]=k);save();render();toast('Saved')}
function preset(p){const t=new Date(),f=new Date();if(p==='w')f.setDate(t.getDate()-6);if(p==='m')f.setDate(1);$('rf').value=f.toISOString().slice(0,10);$('rt').value=t.toISOString().slice(0,10);runRep()}
function vRep(){return `<div class="card"><div class="row"><select id="rc">${classesOf().map(c=>`<option>${esc(c)}</option>`).join('')}</select><input id="rq" placeholder="Search name / adm no"><input type="date" id="rf" value="${today()}"><input type="date" id="rt" value="${today()}"></div>
<div class="row"><button class="s" onclick="preset('d')">Daily</button><button class="s" onclick="preset('w')">Weekly</button><button class="s" onclick="preset('m')">Monthly</button><button onclick="runRep()">Generate</button><button class="s" onclick="csv()">Export CSV</button><button class="s" onclick="window.print()">Print</button></div></div><div class="card tw" id="ro"><span class="mu">Choose class and dates, then Generate.</span></div>`}
let rows=[];
function runRep(){const c=v('rc'),q=v('rq').toLowerCase(),f=v('rf'),t=v('rt'),one=f===t;rows=[];
 db.students.filter(s=>s.cls===c&&(s.name.toLowerCase().includes(q)||s.adm.toLowerCase().includes(q))).forEach(s=>{let P=0,A=0,L=0,d='-';
 for(const k in db.att){const[dt,cl]=k.split('|');if(cl!==c||dt<f||dt>t)continue;const x=db.att[k][s.id];if(x==='P')P++;else if(x==='A')A++;else if(x==='L')L++;if(one&&x)d=x}
 const n=P+A+L;rows.push([s.adm,s.name,P,A,L,n?(P/n*100).toFixed(1)+'%':'–',d])});
 $('ro').innerHTML=`<table><tr><th>Adm No</th><th>Name</th><th>Present</th><th>Absent</th><th>Leave</th><th>%</th>${one?'<th>Status</th>':''}</tr>${rows.map(r=>`<tr>${(one?r:r.slice(0,6)).map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')||'<tr><td>No records</td></tr>'}</table>`}
function dl(n,t,ty){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;a.click()}
function csv(){if(!rows.length)return;dl('attendance-report.csv',['AdmNo,Name,Present,Absent,Leave,Percent,Status',...rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(','))].join('\n'),'text/csv')}
function vStu(){const q=(window._sq||'').toLowerCase();return `<div class="card"><h3>Add student</h3><div class="row"><input id="sa" placeholder="Admission no" maxlength="20"><input id="sn" placeholder="Name" maxlength="60"><select id="sc">${db.classes.map(c=>`<option>${esc(c)}</option>`).join('')}</select><button onclick="addStu()">Add</button></div><p class="err">${esc(msg)}</p></div>
<div class="card"><input id="sq" style="width:100%" placeholder="Search / filter students" value="${esc(window._sq||'')}" oninput="window._sq=this.value;render();$('sq').focus()"><div class="tw"><table>${db.students.filter(s=>(s.name+s.adm+s.cls).toLowerCase().includes(q)).map(s=>`<tr><td>${esc(s.adm)}</td><td>${esc(s.name)}</td><td>${esc(s.cls)}</td><td><button class="s" onclick="editStu('${s.id}')">Edit</button> <button class="s" onclick="delStu('${s.id}')">Delete</button></td></tr>`).join('')}</table></div></div>`}
function addStu(){const a=v('sa'),n=v('sn'),c=v('sc');msg='';if(!/^[\w\-\/]{1,20}$/.test(a)||n.length<2||!c)msg='Enter a valid admission no, name and class.';else if(db.students.some(s=>s.adm===a))msg='Admission no already exists.';else{db.students.push({id:'s'+Date.now(),adm:a,name:n,cls:c});save();toast('Student added')}render()}
function editStu(id){const s=db.students.find(x=>x.id===id),n=prompt('Name',s.name),c=prompt('Class ('+db.classes.join(', ')+')',s.cls);if(n&&n.trim().length>1)s.name=n.trim();if(c&&db.classes.includes(c.trim()))s.cls=c.trim();save();render()}
function delStu(id){if(confirm('Delete this student?')){db.students=db.students.filter(s=>s.id!==id);save();render()}}
function vCls(){return `<div class="card"><div class="row"><input id="cn" placeholder="Class-Section e.g. 7-B" maxlength="10"><button onclick="addCls()">Add class</button></div>${db.classes.map(c=>`<span class="tag" style="margin:3px;display:inline-block">${esc(c)} · ${db.students.filter(s=>s.cls===c).length}</span>`).join('')}</div>`}
function addCls(){const c=v('cn');if(/^[\w\-]{1,10}$/.test(c)&&!db.classes.includes(c)){db.classes.push(c);save();toast('Class added')}render()}
function vUsr(){const q=(window._uq||'').toLowerCase(),T=db.users.filter(u=>u.role==='teacher'),L=T.filter(u=>(u.name+u.u).toLowerCase().includes(q)),n=x=>T.filter(u=>(u.status||'active')===x).length;
const mk=u=>{let c=0,l=0;for(const k in db.meta||{})if(db.meta[k].by===u.u){c++;l=Math.max(l,db.meta[k].at)}return[c,l]};
return `<div class="grid"><div class="stat"><span>Teachers</span><b data-n="${T.length}"></b></div><div class="stat"><span>Active</span><b data-n="${n('active')}"></b></div><div class="stat"><span>Pending</span><b data-n="${n('pending')}"></b></div><div class="stat"><span>Suspended</span><b data-n="${n('suspended')}"></b></div></div>
<div class="card"><h3>Add or reset teacher</h3><div class="row"><input id="un" placeholder="Username" maxlength="20"><input id="uf" placeholder="Full name" maxlength="50"><input id="up" type="password" placeholder="Password (min 8)"></div>
<div class="row"><input id="ucl" placeholder="Classes e.g. 6-A,7-B"><button onclick="addUsr()">Save teacher</button></div><p class="err">${esc(msg)}</p><p class="mu">Administrators can manage teacher access but cannot view or change attendance entries.</p></div>
<div class="card"><input id="uq" style="width:100%" placeholder="Search teachers" value="${esc(window._uq||'')}" oninput="window._uq=this.value;render();$('uq').focus()"><div class="tw"><table><tr><th>Teacher</th><th>Username</th><th>Classes</th><th>Status</th><th>Last login</th><th>Sheets marked</th><th></th></tr>${L.map(u=>{const m=mk(u),st=u.status||'active';return `<tr><td>${esc(u.name)}</td><td>${esc(u.u)}</td><td>${esc(u.cls.join(', ')||'None')}</td><td><span class="tag" style="${st==='active'?'':'background:rgba(184,55,43,.14);color:var(--no)'}">${st}</span></td><td class="mu">${u.last?new Date(u.last).toLocaleString():'Never'}</td><td>${m[0]}</td><td>${st==='pending'?`<button onclick="appr('${esc(u.u)}')">Approve</button> `:`<button class="s" onclick="togUsr('${esc(u.u)}')">${st==='suspended'?'Restore access':'Suspend'}</button> `}<button class="s" onclick="setCls('${esc(u.u)}')">Classes</button> <button class="s" onclick="delUsr('${esc(u.u)}')">Remove</button></td></tr>`}).join('')||'<tr><td>No teachers found.</td></tr>'}</table></div></div>
<div class="card"><h3>Your account</h3><div class="row"><input id="pw" type="password" placeholder="New password (min 8)"><button onclick="chPw()">Change password</button></div></div>`}
function togUsr(u){const x=db.users.find(y=>y.u===u);x.status=x.status==='suspended'?'active':'suspended';save();toast(x.status==='suspended'?'Access suspended':'Access restored');render()}
async function chPw(){const p=$('pw').value;if(p.length<8)return toast('Minimum 8 characters');me.h=await sha(me.u,p);save();$('pw').value='';toast('Password updated')}
function appr(u){const x=db.users.find(y=>y.u===u);x.status='active';save();toast('Approved');render()}
function setCls(u){const x=db.users.find(y=>y.u===u),c=prompt('Classes ('+db.classes.join(', ')+')',x.cls.join(','));if(c!==null){x.cls=c.split(',').map(a=>a.trim()).filter(a=>db.classes.includes(a));save();render()}}
async function addUsr(){const u=v('un'),p=$('up').value;msg='';if(!/^[a-z0-9_.]{3,20}$/i.test(u)||p.length<8||v('uf').length<2)msg='Valid username (3-20), name and password (8+) required.';
 else if(db.users.some(x=>x.u===u&&x.role==='admin'))msg='That username belongs to an administrator.';else{const o={u,h:await sha(u,p),name:v('uf'),role:'teacher',cls:v('ucl').split(',').map(x=>x.trim()).filter(x=>db.classes.includes(x)),status:'active'},i=db.users.findIndex(x=>x.u===u);i<0?db.users.push(o):db.users[i]=o;save();if(u===me.u)me=o;toast('Teacher saved')}render()}
function delUsr(u){if(confirm('Remove '+u+'?')){db.users=db.users.filter(x=>x.u!==u);save();render()}}
function vBak(){return `<div class="card"><p>Data lives in this browser. Download a backup regularly. Restore replaces all current data.</p><div class="row"><button onclick="dl('attendance-backup-'+today()+'.json',JSON.stringify(db),'application/json')">Download backup</button><input type="file" accept=".json" onchange="restore(this.files[0])"></div><p class="err">${esc(msg)}</p></div>`}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.users||!d.students||!d.classes||!d.att)throw 0;db=d;save();msg='Restored.'}catch(e){msg='Invalid backup file.'}render()};r.readAsText(f)}
theme();load().then(auth);
</script></body></html>
